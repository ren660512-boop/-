<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1423"><meta name="description" content="喝一口雪碧，挑战你的好友。五场个性 Boss 战，移动、平 A，轻松闯关。"><title>雪碧大作战 · 好友挑战</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1423'/%3E%3Cpath d='M18 3 7 18h8l-1 11 12-17h-9z' fill='%23b7f65a'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main class="shell">
<header class="top"><a class="brand" href="./" aria-label="雪碧大作战首页"><span class="brand-icon">ϟ</span><span>雪碧大作战<small>FRIENDS BOSS RUSH</small></span></a><div class="top-right"><span class="edition">v1.1 · 夜场开打</span><button id="music" class="icon-btn music-btn" aria-label="切换背景音乐" aria-pressed="true">♫ BGM 开</button><label class="volume-control" title="背景音乐音量"><span>音量</span><input id="volume" type="range" min="0" max="100" value="58" aria-label="背景音乐音量"></label><button id="sound" class="icon-btn" aria-label="关闭音效" title="音效">♪ 开</button><button id="pause" class="icon-btn" aria-label="暂停游戏">Ⅱ</button></div></header>
<section class="layout"><div class="game-column"><div class="hud"><div class="player-hud"><span class="eyebrow">PLAYER 01</span><div class="health-label"><strong>你</strong><span id="hpText">100 / 100</span></div><div class="health-track"><div id="hpFill"></div></div></div><div class="soda-hud"><span class="eyebrow">每瓶 +34 生命</span><button id="heal" title="按 E 或点击喝雪碧回血" aria-label="喝雪碧回血，快捷键 E">🥤 喝雪碧 <strong id="sodaCount">× 3</strong><kbd>E</kbd></button><span class="heal-help" id="healHelp">电脑按 E · 手机点此回血</span></div></div>
<div class="arena" id="arena"><canvas id="game" width="960" height="600" aria-label="好友 Boss 战斗场地"></canvas><div class="arena-label"><span>● LIVE ARENA</span><span id="roundLabel">等待入场</span></div><div class="boss-hud" id="bossHud" hidden><div><strong id="bossName"></strong><span id="bossPercent"></span></div><div class="boss-track"><i id="bossFill"></i></div></div><div class="heal-alert" id="healAlert" hidden>血量不足！按 E / 点击雪碧回血</div><div id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div></div>
<div class="touch-controls" id="touch"><div class="dpad"><button data-key="ArrowUp" aria-label="向上">▲</button><button data-key="ArrowLeft" aria-label="向左">◀</button><button data-key="ArrowDown" aria-label="向下">▼</button><button data-key="ArrowRight" aria-label="向右">▶</button></div><button class="attack-touch" data-key="Space">平 A<br><small>按住攻击</small></button></div>
<footer class="controls"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span><span><kbd>空格</kbd> 按住平 A</span><span><kbd>E</kbd> 喝雪碧</span><span><kbd>Esc</kbd> 暂停</span></footer></div>
<aside class="sidebar"><div class="route-heading"><div><span class="eyebrow">THE LINEUP</span><h2>今晚，全是熟人。</h2></div><span id="progress">0 / 5</span></div><ol id="lineup"></ol><div class="tip-card"><span class="eyebrow">生存小贴士</span><p id="tip">平 A 会自动朝最近的 Boss 发射气泡。你负责走位，剩下的交给雪碧。</p><span class="tip-mark">✳</span></div><div class="bottom-note"><span class="status-dot"></span>朋友切磋，点到为止。</div></aside></section>
<div class="page-bottom"><span>v1.1 · 夜场开打 · E 喝雪碧</span><span>6 位好友 / 5 场挑战</span></div>
</main><script src="music.js"></script><script src="game.js"></script></body></html>
